<div class="auth-container">
  <div class="auth-card">
    <h2>Regístrate</h2>
    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="full_name" name="full_name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>
      <div class="form-group">
        <label>Confirmar Contraseña</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" [(ngModel)]="isAdmin" name="isAdmin">
          Registrarme como administrador
        </label>
      </div>
      <button type="submit" class="btn-auth" [disabled]="password !== confirmPassword || !password">Crear Cuenta</button>
    </form>
    <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
