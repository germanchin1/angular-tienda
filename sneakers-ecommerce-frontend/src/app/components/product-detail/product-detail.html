<div class="detail-container" *ngIf="product">
  <div class="image-box">
    <img [src]="product.image_url" [alt]="product.name">
  </div>
  <div class="info-box">
    <h1>{{ product.name }}</h1>
    <p class="price">{{ product.price | currency:'EUR' }}</p>
    <p class="description">{{ product.description }}</p>
    
    <div class="options">
      <label>Talla:</label>
      <select [(ngModel)]="selectedSize">
        <option value="">Selecciona una talla</option>
        @for (size of product.sizes; track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>

      <label>Cantidad:</label>
      <input type="number" [(ngModel)]="quantity" min="1" [max]="product.stock">
    </div>

    <button (click)="addToCart()" class="btn-add" [disabled]="!selectedSize">
      Añadir al Carrito
    </button>
    
    <p *ngIf="!auth.isLoggedIn()" class="login-tip">
      Inicia sesión para añadir productos al carrito.
    </p>
  </div>
</div>
