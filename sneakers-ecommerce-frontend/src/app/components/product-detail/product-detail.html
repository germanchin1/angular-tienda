<div class="detail-state" *ngIf="errorMessage && !product">
  <p>{{ errorMessage }}</p>
</div>

<div class="detail-state" *ngIf="!errorMessage && !product">
  <p>El producto no está disponible.</p>
</div>

<div class="detail-container" *ngIf="product as currentProduct">
  <div class="image-box">
    <img [src]="currentProduct.image_url || 'https://placehold.co/600x600?text=Sin+imagen'" [alt]="currentProduct.name">
  </div>
  <div class="info-box">
    <h1>{{ currentProduct.name }}</h1>
    <p class="price">{{ currentProduct.price | currency:'EUR' }}</p>
    <p class="description">{{ currentProduct.description }}</p>
    
    <div class="options">
      <label>Talla:</label>
      <select [(ngModel)]="selectedSize">
        <option value="">Selecciona una talla</option>
        <option *ngFor="let size of currentProduct.sizes" [value]="size">{{ size }}</option>
      </select>

      <label>Cantidad:</label>
      <input type="number" [(ngModel)]="quantity" min="1" [max]="currentProduct.stock">
    </div>

    <button (click)="addToCart()" class="btn-add" [disabled]="!selectedSize">
      Añadir al Carrito
    </button>
    
    <p *ngIf="!auth.isLoggedIn()" class="login-tip">
      Inicia sesión para añadir productos al carrito.
    </p>
  </div>
</div>
